[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agents"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic", "python-dotenv", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "products*"]
